<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis AI - Command Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            background-color: #0a0a0a;
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #171717; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        ::placeholder { color: #52525b; }
    </style>
</head>
<body class="p-2 md:p-4 flex flex-col gap-4">

    <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-3 flex flex-col xl:flex-row justify-between items-center gap-4 shadow-lg relative overflow-hidden">
        
        <div class="flex items-center gap-4 z-10 w-full xl:w-auto">
            <div class="flex items-center gap-2">
                <i class="fas fa-shield text-sky-500"></i>
                <span class="font-bold tracking-tight text-white">AEGIS</span>
            </div>
            
            <div class="flex flex-col flex-1">
                <div class="flex justify-between items-end mb-1">
                    <div class="text-xs text-neutral-400 font-bold uppercase tracking-wider">Progress & ETA</div>
                    <span id="progress-percent" class="text-xs text-sky-400 mono font-bold">0%</span>
                </div>
                
                <div class="w-full h-1.5 bg-neutral-800 rounded-full overflow-hidden mb-2 border border-white/5">
                    <div id="progress-fill" class="h-full bg-gradient-to-r from-sky-600 to-sky-400 shadow-[0_0_8px_rgba(56,189,248,0.5)] transition-all duration-500" style="width: 0%"></div>
                </div>

                <div class="flex items-baseline gap-2">
                    <span id="progress-text" class="text-2xl font-bold text-white mono leading-none">0/0</span>
                    <span id="eta-label" class="text-xs text-sky-400 mono bg-sky-900/30 px-1.5 py-0.5 rounded border border-sky-500/20">--:--</span>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-center gap-4 md:gap-6 md:px-6 md:border-x border-t border-b md:border-t-0 md:border-b-0 border-neutral-800/50 z-10 py-2 md:py-0 w-full md:w-auto">
            <!-- Processing Speed: persistent -->
            <div class="flex flex-col w-28 md:w-32">
                <div class="text-[9px] text-neutral-500 uppercase tracking-widest font-bold mb-1">Processing Speed</div>
                <div class="flex items-center gap-2">
                    <span class="text-sm text-sky-400 font-bold mono"><span id="tokens-sec-text">0.0</span><span class="text-[10px] text-sky-500/70 ml-0.5">ch/s</span></span>
                    <span id="sparkline-chart" class="text-sky-500/40 text-[10px] tracking-[0.05em] mono h-4 overflow-hidden flex items-end"></span>
                </div>
            </div>

            <!-- Session Cost: always visible -->
            <div class="flex flex-col md:w-48">
                <div class="text-xs text-neutral-500 uppercase tracking-widest font-bold mb-1 flex justify-between items-center gap-2">
                    <span>Session Cost</span>
                    <span id="cache-badge" class="text-emerald-500 text-[9px] flex items-center gap-1 bg-emerald-500/10 px-1 rounded border border-emerald-500/20">
                        <i class="fas fa-bolt text-[8px]"></i> Cache 0%
                    </span>
                </div>
                <div class="flex items-baseline gap-2">
                    <span id="cost-total" class="text-base font-bold text-white mono">$0.00</span>
                    <div class="flex flex-col gap-0.5">
                        <span id="cost-main" class="text-[10px] text-neutral-500 mono bg-neutral-950 px-1.5 rounded border border-neutral-800">M: $0.000</span>
                        <span id="cost-judge" class="text-[10px] text-neutral-500 mono bg-neutral-950 px-1.5 rounded border border-neutral-800">J: $0.000</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex flex-col z-10 w-full xl:w-auto">
            <div class="text-xs text-neutral-400 font-semibold mb-1 flex items-center gap-1.5">
                <i class="fas fa-tag text-neutral-500 text-[10px]"></i>
                <span>Cause:</span>
                <span id="last-decision" class="text-amber-400 truncate flex-1 min-w-0">Initializing...</span>
                <div class="flex items-center gap-1.5 bg-neutral-950 border border-neutral-800 px-2.5 py-1 rounded-md shadow-inner flex-shrink-0 ml-2">
                    <div id="sync-dot" class="w-2 h-2 bg-emerald-500 rounded-full shadow-[0_0_6px_#10b981]"></div>
                    <span id="sync-text" class="text-[11px] font-bold text-emerald-500 uppercase tracking-widest">Sync</span>
                </div>
            </div>

            <div class="flex items-start gap-3 bg-neutral-950 border border-neutral-800 px-3 py-1.5 rounded-lg shadow-inner w-full xl:w-auto">
                <div class="flex items-center gap-2 flex-shrink-0">
                    <div id="status-dot" class="w-2 h-2 rounded-full bg-sky-500"></div>
                    <span id="status-text" class="text-base font-bold text-sky-500 uppercase tracking-wide max-w-[108px] xl:max-w-none leading-tight">Idle</span>
                </div>
                <div class="w-px bg-neutral-700 flex-shrink-0 self-stretch"></div>
                <div class="flex items-center gap-1 text-sm mono text-neutral-300 flex-shrink-0 self-center">
                    <span>B:<span id="batch-size">0</span></span><i id="batch-trend-icon" class="fas fa-minus text-neutral-500 text-[10px]"></i>
                </div>
                <div id="timer-divider" class="w-px bg-neutral-700 flex-shrink-0 self-stretch"></div>
                <div id="timer-text" class="flex flex-wrap items-center gap-1 text-base mono font-bold text-white ml-auto self-center">
                    --:--
                </div>
            </div>
        </div>
    </div>

    <div class="flex flex-col md:flex-row gap-4">

        <!-- Terminal Logs -->
        <div class="flex-1 min-w-0 bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden flex flex-col shadow-lg">
            <button onclick="toggleSection('terminal-body', 'terminal-icon')" class="flex justify-between items-center w-full px-4 py-2 bg-neutral-800/50 hover:bg-neutral-800 transition-colors border-b border-neutral-800 focus:outline-none">
                <div class="flex items-center gap-2 text-xs font-bold text-neutral-300 uppercase tracking-widest">
                    <i class="fas fa-terminal text-emerald-500"></i> Terminal Logs
                </div>
                <div class="flex items-center gap-4">
                    <div class="relative" onclick="event.stopPropagation();">
                        <i class="fas fa-search absolute left-2 top-[7px] text-neutral-500 text-[10px]"></i>
                        <input id="log-filter" type="text" placeholder="Filter logs..." class="bg-neutral-950 border border-neutral-700 rounded-md pl-6 pr-2 py-1 text-[11px] text-neutral-300 w-32 md:w-36 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all font-mono">
                    </div>
                    <i id="terminal-icon" class="fas fa-chevron-up text-neutral-500 text-xs transition-transform duration-200"></i>
                </div>
            </button>
            <div id="terminal-body" class="p-4 mono text-[12px] leading-relaxed text-neutral-300 h-[250px] md:h-[450px] overflow-y-auto"></div>
        </div>

        <!-- Live Intercept Feed -->
        <div class="flex-1 min-w-0 bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden flex flex-col shadow-lg">
            <button onclick="toggleSection('subs-body', 'subs-icon')" class="flex justify-between items-center w-full px-4 py-2 bg-neutral-800/50 hover:bg-neutral-800 transition-colors border-b border-neutral-800 focus:outline-none">
                <div class="flex items-center gap-2 text-xs font-bold text-neutral-300 uppercase tracking-widest">
                    <i class="fas fa-closed-captioning text-sky-400"></i> Live Intercept Feed
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-[10px] text-neutral-500 font-medium">Currently viewing history</span>
                    <i id="subs-icon" class="fas fa-chevron-down text-neutral-500 text-xs transition-transform duration-200"></i>
                </div>
            </button>
            <div id="subs-body" class="hidden p-4 h-[300px] md:h-[450px] overflow-y-auto bg-neutral-950">
                <div class="grid grid-cols-12 gap-4 text-[10px] font-bold text-neutral-500 uppercase tracking-widest border-b border-neutral-800 pb-2 mb-2">
                    <div class="col-span-1 text-center">#</div>
                    <div class="col-span-5">English Original</div>
                    <div class="col-span-6 text-right">Hebrew Translated</div>
                </div>
                <div id="translation-feed-content"></div>
            </div>
        </div>

    </div>

    <script src="/web/app.js"></script>
    <script>
        function toggleSection(bodyId, iconId) {
            const body = document.getElementById(bodyId);
            const icon = document.getElementById(iconId);
            if (body.classList.contains('hidden')) {
                body.classList.remove('hidden');
                icon.classList.remove('fa-chevron-down');
                icon.classList.add('fa-chevron-up');
            } else {
                body.classList.add('hidden');
                icon.classList.remove('fa-chevron-up');
                icon.classList.add('fa-chevron-down');
            }
        }
    </script>
</body>
</html>
